{# Student registration form #}
{% extends "base.html" %}
{% block title %}Student Registration{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-3">Student Registration</h2>
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" name="name" class="form-control" value="{{ request.form.get('name', '') }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" value="{{ request.form.get('email', '') }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Roll number</label>
                <input type="text" name="roll_no" class="form-control" value="{{ request.form.get('roll_no', '') }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Contact</label>
                <input type="text" name="contact" class="form-control" value="{{ request.form.get('contact', '') }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Password (at least 6 characters)</label>
                <input type="password" name="password" class="form-control" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
        <p class="mt-3">Already registered? <a href="{{ url_for('login.login') }}">Login</a></p>
    </div>
</div>
{% endblock %}
