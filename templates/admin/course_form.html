{# Admin: add or edit a course (course is None when adding) #}
{% extends "base.html" %}
{% block title %}{% if course %}Edit course{% else %}Add course{% endif %}{% endblock %}
{% block content %}
<h2 class="mb-3">{% if course %}Edit course {{ course.code }}{% else %}Add course{% endif %}</h2>

<form method="post" class="col-md-6">
    <div class="mb-3">
        <label class="form-label">Course code</label>
        <input type="text" name="code" class="form-control" value="{{ form.get('code', '') }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Course name</label>
        <input type="text" name="name" class="form-control" value="{{ form.get('name', '') }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="3">{{ form.get('description', '') }}</textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Credits (1 to 10)</label>
        <input type="number" name="credits" class="form-control" min="1" max="10" value="{{ form.get('credits', 4) }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
            {% for status in statuses %}
            <option value="{{ status }}" {% if form.get('status', 'Active') == status %}selected{% endif %}>{{ status }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a class="btn btn-secondary" href="{{ url_for('admin_courses.list_courses') }}">Cancel</a>
</form>
{% endblock %}
